Section "Device"
    Identifier "ILI9486"
    Driver "fbdev"
    Option "fbdev" "/dev/fb1"
EndSection

Section "Monitor"
    Identifier "SPI_LCD"
    HorizSync 28-33
    VertRefresh 30
    Modeline "320x480_30" 6.40 320 330 340 350 480 490 492 494 -HSync -VSync
EndSection

Section "Screen"
    Identifier "Default Screen"
    Device "ILI9486"
    Monitor "SPI_LCD"
    DefaultDepth 16
    SubSection "Display"
        Depth 16
        Modes "320x480_30"
    EndSubSection
EndSection

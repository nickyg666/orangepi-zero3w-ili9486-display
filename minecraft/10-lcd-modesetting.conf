Section "ServerLayout"
    Identifier "LCD"
    Screen 0 "LCD Screen"
    Option "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier "LCD Panel"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card1"
    Option "AccelMethod" "none"
EndSection

Section "Monitor"
    Identifier "LCD Monitor"
    DisplaySize 812 541
EndSection

Section "Screen"
    Identifier "LCD Screen"
    Device "LCD Panel"
    Monitor "LCD Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "960x640"
    EndSubSection
EndSection

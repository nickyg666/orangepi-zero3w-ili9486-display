Section "InputClass"
	Identifier	"ADS7846 touchscreen HDMI mapping"
	MatchProduct	"ADS7846 Touchscreen"
	# Always attach to the core pointer (gnome-shell detaches it on session start)
	Option	"Floating"	"false"
	# Panel mirrors the full HDMI desktop; touch maps 1:1 normalized across it.
	Option	"TransformationMatrix"	"1 0 0 0 1 0 0 0 1"
EndSection

Section "InputClass"
	Identifier	"ADS7846 touchscreen HDMI mapping"
	MatchProduct	"ADS7846 Touchscreen"
	# Panel mirrors the full HDMI desktop (spi-mirror); touch maps 1:1
	# normalized across the 1920x1080 screen. No rotation, no scale -
	# X normalizes the device range to 0..1, so identity maps it everywhere.
	Option	"TransformationMatrix"	"1 0 0 0 1 0 0 0 1"
EndSection

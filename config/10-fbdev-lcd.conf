Section "ServerFlags"
	Option "AutoAddGPU" "false"
	Option "AutoAddDevices" "true"
EndSection

Section "Device"
	Identifier  "LCD Panel"
	Driver      "fbdev"
	Option      "fbdev" "/dev/fb0"
EndSection

Section "Screen"
	Identifier "LCD Screen"
	Device     "LCD Panel"
	DefaultDepth 24
	SubSection "Display"
		Depth 24
		Modes "960x640"
	EndSubSection
EndSection
